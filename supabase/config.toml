# Supabase CLI configuration for dampingi
# Reference: https://supabase.com/docs/guides/cli/config

[api]
# For local development, point to the Docker stack
# Started with: supabase start
# Reset with: supabase db reset
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Local Postgres instance (spun up by `supabase start`)
port = 54322
ssl_mode = "disable"

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:3000"
# For local development, use the app's local port (adjust if needed)
additional_redirect_urls = ["http://localhost:8000"]
