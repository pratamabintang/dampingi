[pytest]
testpaths = tests
# Default run is offline: live tests need credentials and network, so they
# are opt-in (`pytest -m live`). See ADR-0006.
addopts = -q -m "not live"
markers =
    live: talks to the real Supabase project (needs tests/.env and network)
    integration: talks to local Supabase stack (needs supabase start)
filterwarnings =
    # The test mints a deliberately weak HMAC key on purpose, to prove
    # /me rejects attacker tokens; the warning is expected noise.
    ignore::jwt.warnings.InsecureKeyLengthWarning
